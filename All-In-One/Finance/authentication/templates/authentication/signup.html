{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - Recruitment Digital Software</title>
    <link rel="stylesheet" href="{% static 'authentication/static/css/signup.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">

            <!-- HEADER -->
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2>Create Your Staff Account</h2>
            </div>

            <!-- ALERTS -->
            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">
                        <i class="fas fa-circle-exclamation"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <!-- SIGNUP FORM -->
            <form method="post">
                {% csrf_token %}

                <!-- USERNAME -->
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Username
                    </label><input type="text"
                           id="username"
                           name="username"
                           class="form-control"
                           placeholder="Enter your username"required></div>

                <!-- FIRST NAME -->
                <div class="form-group">
                    <label for="first_name">
                        <i class="fas fa-id-card"></i>
                        First Name
                    </label>

                    <input type="text"
                           id="first_name"
                           name="first_name"
                           class="form-control"
                           placeholder="Enter first name"
                           required>
                </div>

                <!-- LAST NAME -->
                <div class="form-group">
                    <label for="last_name">
                        <i class="fas fa-id-card-clip"></i>
                        Last Name
                    </label>

                    <input type="text"
                           id="last_name"
                           name="last_name"
                           class="form-control"
                           placeholder="Enter last name"
                           required>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           placeholder="Enter email address"
                           required>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <label for="password1">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>

                    <input type="password"
                           id="password1"
                           name="password1"
                           class="form-control"
                           placeholder="Create password"
                           required>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="form-group">
                    <label for="password2">
                        <i class="fas fa-shield-halved"></i>
                        Confirm Password
                    </label>
                    <input type="password"
                           id="password2"
                           name="password2"
                           class="form-control"
                           placeholder="Confirm password"
                           required>
                </div>

                <!-- BUTTON -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i>
                        Create Account
                    </button>
                </div>
            </form>

            <!-- LOGIN LINK -->
            <div class="signup-link">
                <p>
                    Already have an account?
                    <a href="{% url 'login' %}">
                        Sign In
                    </a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
