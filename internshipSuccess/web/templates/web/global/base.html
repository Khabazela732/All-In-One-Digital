<!DOCTYPE html>
{% load static %}
<html class="no-js" lang="en">
<head>
	<meta charset="utf-8" />
	<meta http-equiv="x-ua-compatible" content="ie=edge" />
	<title> Internship Success {% block title %}{% endblock title %} </title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/favicon.png'%}" />
	<!-- Place favicon.ico in the root directory -->
	<!-- CSS here -->
	<link rel="stylesheet" href="{% static 'web/assets/css/bootstrap.min.css' %}" />
	<link rel="stylesheet" href="{% static 'web/assets/css/owl.carousel.min.css' %}" />
	<link rel="stylesheet" href="{% static 'web/assets/css/animate.css' %}" />
	<link rel="stylesheet" href="{% static 'web/assets/css/magnific-popup.css' %}" />
	<link rel="stylesheet" href="{% static 'web/assets/css/all.min.css' %}" />
	<link rel="stylesheet" href="{% static 'web/assets/css/gt-font.css' %}" />
	<link rel="stylesheet" href="{% static 'web/assets/css/metisMenu.css' %}" />
	<link rel="stylesheet" href="{% static 'web/assets/css/nice-select.css' %}" />
	<link rel="stylesheet" href="{% static 'web/assets/css/spacing.css' %}" />
	<link rel="stylesheet" href="{% static 'web/assets/css/main.css' %}" />
</head>
<body>
  	<!-- preloader -->
	<div id="preloader">
		<div class="preloader">
			<span></span>
			<span></span>
		</div>
	</div>
	<!-- preloader end  -->
  	<!-- header-area start -->
  {% include "web/essentials/header.html" %}
	<!-- header-area end -->
	<!-- slide-bar start -->
  {% include "web/essentials/slidebar.html" %}
	<!-- slide-bar end -->
  {% block content %}{% endblock content %}
  	<!-- Fullscreen search -->
	<div class="search-wrap">
		<div class="search-inner">
			<i class="fas fa-times search-close" id="search-close"></i>
			<div class="search-cell">
				<form method="get">
					<div class="search-field-holder">
						<input type="search" class="main-search-input" placeholder="Search Your Keyword...">
					</div>
				</form>
			</div>
		</div>
	</div>
  <!-- Vendor JS Files -->
  {% include "web/global/scripts.html" %}
</body>
</html>
