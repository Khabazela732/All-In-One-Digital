<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Affidavit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Upload Your Affidavit</h2>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" enctype="multipart/form-data" class="mt-4">
            {% csrf_token %}

            <div class="mb-3">
                <label for="national_id" class="form-label">National ID</label>
                <input type="text" name="national_id" id="national_id" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="id_affidavit" class="form-label">Upload Affidavit</label>
                {{ form.affidavit}}
            </div>
            <div class="mb-3">
                <label for="id_affidavit" class="form-label">Upload first assignment</label>
                {{ form.first_assignment}}
            </div>

            <button type="submit" class="btn btn-primary">Submit Affidavit</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
