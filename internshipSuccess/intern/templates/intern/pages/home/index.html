{% extends "intern/global/base.html" %}
{% load static %}
{% block content %}   
<style>
        

    @import url('https://fonts.googleapis.com/css?family=Open+Sans&display=swap');

.track{
position: relative;
background-color: #ddd;
height: 4px;
display: -webkit-box;
display: -ms-flexbox;
display: flex;
margin-bottom: 60px;
margin-top: 50px;
border-radius: 5px;
}
.track .step{
-webkit-box-flex: 1;
-ms-flex-positive: 1;
flex-grow: 1;
width: 25%;
margin-top: -18px;
text-align: center;
position: relative
}
.track .step.active:before{
background: #435ebe
}
.track .step::before{
height: 5px;
border-radius: 5px;
position: absolute;
content: "";
width: 100%;
left: 0;
top: 18px
}
.track .step.active .icon{
background: #435ebe;
color: #fff
}
.track .icon{
display: inline-block;
width: 40px;
height: 40px;
line-height: 40px;
position: relative;
border-radius: 100%;
background: #ddd
}
.track .step.active .text{
/* font-weight: 400; */
font-weight: bold;
}
.track .text{
display: block;
margin-top: 7px
}


    
</style>
<section class="section">
    <div class="row">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h4>Induction Progress</h4>
                </div>
                {% if induction_enrollment %}  
                {% include "intern/pages/home/induction_progress_tracking.html" %}
                {% endif %}
            </div>
        </div>     
    </div>
    <div class="row">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h4>Incident Reporting</h4>
                    <div class="card-options">
                        <button type="button" onclick="ReportIncident({{request.user.id}})" class="btn btn-primary btn-sm float-right">Report Incident</button>
                    </div>
                </div>
            </div>
        </div>     
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    function ReportIncident(intern_id) {
    }
</script>
{% endblock content %}
