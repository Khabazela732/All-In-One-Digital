{% extends "intern/global/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-danger text-white">
            Confirm Deletion
        </div>
        <div class="card-body">
            <p>Are you sure you want to delete this assignment?</p>
            {% if assignment.answer %}
                <p>File: <strong>{{ assignment.answer.name }}</strong></p>
            {% else %}
                <p>No file uploaded yet.</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% if assignment._meta.model_name == 'assignment' %}{% url 'view_assignment' %}{% else %}{% url 'view_assignment2' %}{% endif %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
