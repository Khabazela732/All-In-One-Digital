{% extends "hr/global/base.html" %}
{% block content %}
<div class="container">
    <h3>Delete Task</h3>
    <p>Are you sure you want to delete this task?</p>
    <p><strong>{{ object.description }}</strong></p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'scoring-task-list-by-category' object.category.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
