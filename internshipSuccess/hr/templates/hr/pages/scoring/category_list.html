{% extends "hr/global/base.html" %}
{% block content %}
<h3>Categories under {{ department.name }}</h3>

<a href="{% url 'scoring-category-create' department_id=department.id %}" 
   class="btn btn-success mb-3">
    + Add Category
</a>

<ul>
    {% for category in categories %}
    <li>
        {{ category.name }}
        <a href="{% url 'scoring-task-list-by-category' category.id %}">View Tasks</a>
        <a href="{% url 'scoring-category-edit' category.id %}" class="btn btn-sm btn-warning">Edit</a>
        <a href="{% url 'scoring-category-delete' category.id %}" class="btn btn-sm btn-danger">Delete</a>
    </li>
    {% empty %}
    <li>No categories yet.</li>
    {% endfor %}
</ul>

<a href="{% url 'scoring-department-list' %}">← Back to Departments</a>

{% endblock %}
