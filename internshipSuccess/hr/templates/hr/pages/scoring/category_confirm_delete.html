{% extends "hr/global/base.html" %}
{% block content %}
<div class="container">
    <h3>Delete Category</h3>
    <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'scoring-category-list-by-department' object.department.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
