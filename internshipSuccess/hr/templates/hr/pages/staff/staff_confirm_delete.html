{% extends "hr/global/base.html" %}
{% block content %}
<div class="container mt-5">
    <h4>Are you sure you want to delete <strong>{{ staff.full_name }}</strong>?</h4>
    <form method="post">
        {% csrf_token %}
        <a href="{% url 'staff-profile-view' staff.id %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
    </form>
</div>
{% endblock %}
