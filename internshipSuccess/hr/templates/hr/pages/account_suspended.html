<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Suspended</title>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            border: 1px solid #dc3545;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        .card-header {
            background-color: #dc3545;
            color: white;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 6px 6px 0 0;
        }
        .card-body {
            padding: 20px;
        }
        .lead {
            font-size: 1.2rem;
            color: #dc3545;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            Account Suspended
        </div>
        <div class="card-body">
            <p class="lead">
                Your account has been marked as <strong>Inactive</strong> by the HR department.
            </p>
            <p>Please contact HR if you believe this is a mistake or for more information.</p>
        </div>
    </div>

    <script>
        console.log("Account suspended page loaded.");
    </script>
</body>
</html>
