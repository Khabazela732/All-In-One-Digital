<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affidavit Confirmation & Assignment Questions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKzYjpPEjNbsnbjlskAJ3xzQnd9e7KJp3MSJv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <table style="width: 100%; max-width: 600px; margin: 0 auto; font-family: Arial, sans-serif;">
        <tr>
            <td style="padding: 20px 0;">
                <img src="https://www.internshipsuccess.co.za/static/administration/compiled/svg/logo.png" alt="Company Logo" style="display: block; margin: 0 auto; max-width: 200px;">
            </td>
        </tr>
        <tr>
            <td style="padding: 20px 0;">
                <h1 style="text-align: center;">Provide us with Affidavit</h1>
                <p>Dear {{ fullname }}, You are required to submit your affidavit!!</p>
                <a href="https://www.internshipsuccess.co.za/questionnaire/affidavit/{{questionnaire_id}}/" class="btn btn-outline-secondary">Click here to upload</a> 
            </td>
        </tr>
        <tr>
            <td style="padding: 20px 0; text-align: center;">
                <h2>Download Assignment Questions</h2>
                <p>Click the button below to download your assignment questions.</p>
                <a href="https://www.internshipsuccess.co.za/static/assignment.pdf" 
                   class="btn btn-primary" 
                   download>Download Assignment</a>
            </td>
        </tr>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
