<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .logo {
            width: 150px;
            margin-bottom: 20px;
        }
        .otp {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="{{ company_logo_url }}" alt="Company Logo">
        <h2>Email Verification</h2>
        <p>Hello {{ fullname }},</p>
        <p>Your One-Time Password (OTP) for email verification is:</p>
        <p class="otp">{{ otp }}</p>
        <p>Please enter this OTP within 10 minutes to verify your email.</p>
        <p>If you did not request this, please ignore this email.</p>
        <div class="footer">
            <p>&copy; 2025 Internship Success. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
