{% extends "global/base.html" %}
{% block content %}   
<div class="page-heading">
    <h3>{{ host_employer.company_name }}</h3>
</div> 
<section class="section">
    <div class="card">
        <div class="card-header">
            <h5 class="card-title">
             Our Shifts
            </h5>
        </div>
            <div class="card-header">
                <button class="btn btn-primary" onclick="addShift()">Add Shift</button>
            </div>
            <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
            <script>
                function addShift() {
                    Swal.fire({
                        title: 'Add Shift',
                        html: `
                            <input id="shift-name" class="swal2-input" placeholder="Shift Name">
                            <input id="start-time" type="time" class="swal2-input" placeholder="Start Time">
                            <input id="end-time" type="time" class="swal2-input" placeholder="End Time">
                        `,
                        showCancelButton: true,
                        confirmButtonText: 'Add',
                        showLoaderOnConfirm: true,
                        preConfirm: () => {
                            const name = document.getElementById('shift-name').value;
                            const startTime = document.getElementById('start-time').value;
                            const endTime = document.getElementById('end-time').value;
                            
                            if (!name || !startTime || !endTime) {
                                Swal.showValidationMessage('Please enter all fields');
                                return false;
                            }
                            
                            const url = '/hostcompany/shifts/add/';
                            const formData = new FormData();
                            formData.append('name', name);
                            formData.append('start_time', startTime);
                            formData.append('end_time', endTime);
                            
                            return fetch(url, {
                                method: 'POST',
                                headers: {
                                    'X-CSRFToken': '{{ csrf_token }}',
                                },
                                body: formData,
                            })
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error(response.statusText);
                                }
                                return response.json();
                            })
                            .then(data => {
                                Swal.fire({
                                    icon: 'success',
                                    title: 'Shift added successfully',
                                }).then(() => {
                                    location.reload();
                                });
                            })
                            .catch(error => {
                                Swal.fire({
                                    icon: 'error',
                                    title: 'Failed to add Shift',
                                    text: error.message,
                                });
                            });
                        }
                    });
                }
                function editShift(shiftId) {
                    Swal.fire({
                        title: 'Edit Shift',
                        html: `
                            <input id="shift-name" class="swal2-input" placeholder="Shift Name">
                            <input id="start-time" type="time" class="swal2-input" placeholder="Start Time">
                            <input id="end-time" type="time" class="swal2-input" placeholder="End Time">
                        `,
                        showCancelButton: true,
                        confirmButtonText: 'Save',
                        showLoaderOnConfirm: true,
                        preConfirm: () => {
                            const name = document.getElementById('shift-name').value;
                            const startTime = document.getElementById('start-time').value;
                            const endTime = document.getElementById('end-time').value;
                            
                            if (!name || !startTime || !endTime) {
                                Swal.showValidationMessage('Please enter all fields');
                                return false;
                            }
                            
                            const url = `/hostcompany/shifts/edit/${shiftId}/`;
                            const formData = new FormData();
                            formData.append('name', name);
                            formData.append('start_time', startTime);
                            formData.append('end_time', endTime);
                            
                            return fetch(url, {
                                method: 'POST',
                                headers: {
                                    'X-CSRFToken': '{{ csrf_token }}',
                                },
                                body: formData,
                            })
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error(response.statusText);
                                }
                                return response.json();
                            })
                            .then(data => {
                                if (data.success) {
                                    Swal.fire({
                                        icon: 'success',
                                        title: 'Shift updated successfully',
                                    }).then(() => {
                                        location.reload();
                                    });
                                } else {
                                    throw new Error('Failed to update Shift');
                                }
                            })
                            .catch(error => {
                                Swal.fire({
                                    icon: 'error',
                                    title: 'Error',
                                    text: error.message,
                                });
                            });
                        }
                    });
                }
                function deleteShift(shiftId) {
                    Swal.fire({
                        title: 'Delete Shift',
                        text: 'Are you sure you want to delete this shift?',
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#d33',
                        cancelButtonColor: '#3085d6',
                        confirmButtonText: 'Yes, delete it!',
                        cancelButtonText: 'Cancel'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            fetch(`/hostcompany/shifts/delete/${shiftId}/`, {
                                method: 'DELETE',
                                headers: {
                                    'X-CSRFToken': '{{ csrf_token }}',
                                }
                            })
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error('Failed to delete shift');
                                }
                                return response.json();
                            })
                            .then(data => {
                                if (data.success) {
                                    Swal.fire({
                                        icon: 'success',
                                        title: 'Shift deleted successfully',
                                    }).then(() => {
                                        location.reload();
                                    });
                                } else {
                                    throw new Error('Failed to delete shift');
                                }
                            })
                            .catch(error => {
                                Swal.fire({
                                    icon: 'error',
                                    title: 'Error',
                                    text: error.message,
                                });
                            });
                        }
                    });
                }
                
            </script>
            
        <div class="card-body">
            <div class="table-responsive datatable-minimal">
                <table class="table" id="induction-posts">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Start</th>
                            <th>Endtime</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for shift in shifts %}
                    <tr>
                        <td>{{ shift.name }}</td>
                        <td>{{shift.start_time}}</td>
                        <td>{{shift.end_time}}</td>
                        <td>
                            <button class="btn btn-info btn-sm" onclick="editShift('{{shift.id}}')">Edit</button>
                            <button class="btn btn-danger" onclick="deleteShift('{{ shift.id }}')">Delete</button>
                        </td>  
                    </tr>
                    {% endfor %}
                    </tbody>
                </table>
                
            </div>
        </div>
    </div>

{% endblock content %}
