{% extends "global/base.html" %}
{% block content %}   
<div class="page-heading">
    <h3>{{ host_employer.company_name }}</h3>
</div> 
<section class="section">
    <div class="card">
        <div class="card-header">
            <h5 class="card-title">
                Our Companies
            </h5>
            <button class="btn btn-primary" onclick="AddCompany()">Add Companny</button>
        </div>
        <script>

        function AddCompany() {
            // Specify URL and window properties
            var url = '{% url "companies-create" %}'; // URL of the content to be loaded in the popup
            var windowName = 'Popup'; // Name of the popup window
            var width = 500; // Width of the popup window
            var height = 700; // Height of the popup window
            var left = (window.innerWidth - width) / 2; // Position the popup window horizontally
            var top = (window.innerHeight - height) / 2; // Position the popup window vertically
            var features = 'width=' + width + ',height=' + height + ',left=' + left + ',top=' + top + ',resizable=yes,scrollbars=yes';
            // Open the popup window
            var popup = window.open(url, windowName, features);
        }
    </script>
        <div class="card-body">
            <div class="table-responsive datatable-minimal">
                {% if companies %}
                <ul>
                    {% for company in companies %}
                    <li>
                        <a href="{% url 'company-view' company.id %}">{{ company.company_name }}</a>
                    </li>
                    {% endfor %}
                </ul>
                {% endif %}
            </div>
        </div>
    </div>

{% endblock content %}
