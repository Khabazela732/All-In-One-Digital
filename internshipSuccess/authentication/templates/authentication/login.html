{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Success – Login</title>

  <link rel="shortcut icon" href="{% static 'administration/compiled/svg/favicon.svg' %}" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">

  <style>
    body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url("{% static 'administration/compiled/svg/loggin.png' %}") no-repeat center center;
    background-size: cover;
    animation: bgZoom 25s ease-in-out infinite alternate;
}

    @keyframes bgZoom {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }
    #auth {
      width: 100%;
      max-width: 700px;
      padding: 60px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 15px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
      animation: fadeInDown 1s ease;
    }
    .auth-logo img {
      max-width: 250px;
      margin-bottom: 30px;
      transition: transform 0.3s ease;
    }
    .auth-logo img:hover {
      transform: scale(1.1);
    }
    .auth-title {
      font-size: 3.5 rem;
      font-weight: 900;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    .auth-subtitle {
      font-size: 1.3rem;
      color: #7f8c8d;
      margin-bottom: 40px;
    }
    .form-control {
      border-radius: 12px;
      padding: 16px 15px 16px 45px;
      font-size: 1.1rem;
    }
    .form-control-icon {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #7f8c8d;
      font-size: 1.3rem;
    }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #7f8c8d;
      font-size: 1.3rem;
    }
    .btn-primary {
      background: #3498db;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.3rem;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .btn-primary:hover {
      background: #2980b9;
      transform: translateY(-3px);
    }
    .forgot-password {
      color: #3498db;
      font-weight: 600;
    }
    .forgot-password:hover {
      color: #2980b9;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="auth" class="animate__animated animate__fadeInDown">
    <div class="auth-logo">
      <a href="{% url 'home' %}">
        <img src="{% static 'administration/compiled/svg/correct Logo Internship Success Benefit.png' %}" alt="Internship Success Logo">
      </a>
    </div>
    <h1 class="auth-title">Welcome to Internship Success</h1>
    <p class="auth-subtitle">Log in to connect with top companies and unlock internship opportunities.</p>

    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="alert alert-danger animate__animated animate__shakeX">
          {{ form.non_field_errors }}
        </div>
      {% endif %}
      <div class="position-relative mb-4">
        {{ form.username }}
        <div class="form-control-icon"><i class="bi bi-person"></i></div>
      </div>
      <div class="position-relative mb-4">
        {{ form.password }}
        <div class="form-control-icon"><i class="bi bi-shield-lock"></i></div>
        <i class="bi bi-eye-slash password-toggle" id="togglePassword"></i>
      </div>
      <div class="form-check mb-4 text-start">
        <input class="form-check-input" type="checkbox" id="rememberMe">
        <label class="form-check-label" for="rememberMe">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary w-100 shadow-lg">Log In</button>
    </form>

    <div class="mt-3">
      <a class="forgot-password" href="auth-forgot-password.html">Forgot Password?</a>
    </div>
  </div>

  <script>
    const togglePassword = document.querySelector('#togglePassword');
    const passwordField = document.querySelector('#id_password');

    togglePassword.addEventListener('click', function () {
      const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordField.setAttribute('type', type);
      this.classList.toggle('bi-eye');
      this.classList.toggle('bi-eye-slash');
    });
  </script>
</body>
</html>
